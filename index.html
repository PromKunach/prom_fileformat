<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HTML to PDF</title>
  <style>
    *{box-sizing:border-box} html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f5f7fb}
    body{min-height:100vh}.start{min-height:100vh;display:grid;place-items:center;padding:24px}.select-btn,.action-btn{border:0;border-radius:12px;background:#111827;color:#fff;font:inherit;font-weight:700;cursor:pointer;transition:.18s ease}.select-btn{padding:16px 24px;font-size:17px;box-shadow:0 10px 30px rgba(17,24,39,.16)}.select-btn:hover,.action-btn:hover{transform:translateY(-1px);background:#000}.select-btn:focus-visible,.action-btn:focus-visible,.back-btn:focus-visible{outline:3px solid #93c5fd;outline-offset:3px}
    #fileInput{display:none}.workspace{display:none;min-height:100vh;padding:24px}.workspace.active{display:flex;flex-direction:column;gap:16px}.toolbar{display:flex;align-items:center;gap:12px;max-width:1200px;width:100%;margin:0 auto}.back-btn{border:1px solid #d1d5db;background:#fff;border-radius:10px;padding:10px 14px;cursor:pointer;font:inherit}.filename{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:650}.action-btn{padding:11px 16px}.preview-shell{max-width:1200px;width:100%;margin:0 auto;flex:1;min-height:0;background:#dfe3ea;border-radius:16px;padding:20px;box-shadow:inset 0 0 0 1px rgba(17,24,39,.06)}iframe{display:block;width:100%;height:calc(100vh - 120px);min-height:520px;border:0;border-radius:8px;background:#fff;box-shadow:0 10px 30px rgba(17,24,39,.12)}
    .status{font-size:13px;color:#6b7280}.action-btn[disabled]{opacity:.6;cursor:wait;transform:none}
    @media(max-width:640px){.workspace{padding:12px}.toolbar{flex-wrap:wrap}.filename{order:3;flex-basis:100%}.preview-shell{padding:8px;border-radius:12px}iframe{height:calc(100vh - 155px);min-height:400px}}
  </style>
</head>
<body>
  <main id="start" class="start">
    <label class="select-btn" for="fileInput">Select HTML file</label>
    <input id="fileInput" type="file" accept=".html,.htm,text/html" />
  </main>

  <main id="workspace" class="workspace" aria-live="polite">
    <div class="toolbar">
      <button id="backBtn" class="back-btn" type="button">Choose another</button>
      <div>
        <div id="filename" class="filename"></div>
        <div id="status" class="status">Preview ready</div>
      </div>
      <button id="downloadBtn" class="action-btn" type="button">Download PDF</button>
    </div>
    <div class="preview-shell"><iframe id="preview" sandbox="allow-same-origin"></iframe></div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script>
    const fileInput = document.getElementById('fileInput');
    const start = document.getElementById('start');
    const workspace = document.getElementById('workspace');
    const preview = document.getElementById('preview');
    const filename = document.getElementById('filename');
    const status = document.getElementById('status');
    const downloadBtn = document.getElementById('downloadBtn');
    const backBtn = document.getElementById('backBtn');
    let htmlText = '';
    let baseName = 'document';

    function reset(){
      fileInput.value=''; htmlText=''; preview.srcdoc='';
      workspace.classList.remove('active'); start.style.display='grid';
    }

    fileInput.addEventListener('change', async () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;
      if (!/\.(html?|HTML?)$/.test(file.name) && file.type !== 'text/html') {
        alert('Please select an HTML file (.html or .htm).'); reset(); return;
      }
      htmlText = await file.text();
      baseName = file.name.replace(/\.html?$/i,'') || 'document';
      filename.textContent = file.name;
      preview.srcdoc = htmlText;
      start.style.display='none'; workspace.classList.add('active');
      status.textContent='Preview ready';
    });

    backBtn.addEventListener('click', reset);

    downloadBtn.addEventListener('click', async () => {
      if (!htmlText) return;
      downloadBtn.disabled=true; status.textContent='Creating PDF…';
      try {
        const doc = preview.contentDocument;
        if (!doc || !doc.body) throw new Error('Preview is not ready.');
        const element = doc.documentElement.cloneNode(true);
        const wrapper = document.createElement('div');
        const shadow = wrapper.attachShadow ? wrapper.attachShadow({mode:'open'}) : wrapper;
        shadow.appendChild(element);
        wrapper.style.width='210mm'; wrapper.style.background='#fff';
        wrapper.style.position='fixed'; wrapper.style.left='-100000px'; wrapper.style.top='0';
        document.body.appendChild(wrapper);

        const target = shadow === wrapper ? element : shadow.host.shadowRoot.documentElement || element;
        const options = {
          margin: 0,
          filename: baseName + '.pdf',
          image: { type:'jpeg', quality:0.98 },
          html2canvas: { scale:2, useCORS:true, logging:false, windowWidth:1200 },
          jsPDF: { unit:'mm', format:'a4', orientation:'portrait' },
          pagebreak: { mode:['css','legacy'] }
        };
        await html2pdf().set(options).from(element).save();
        wrapper.remove(); status.textContent='PDF downloaded';
      } catch (err) {
        console.error(err);
        status.textContent='Could not create PDF';
        alert('PDF conversion failed. Complex external assets or browser security rules may prevent some HTML files from converting.');
      } finally { downloadBtn.disabled=false; }
    });
  </script>
</body>
</html>
